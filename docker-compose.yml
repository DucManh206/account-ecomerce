services:
  # Ứng dụng Web PHP 8.2 + Apache
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: account_shop_web
    restart: always
    ports:
      - "${WEB_PORT:-8000}:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_DEBUG: ${APP_DEBUG:-0}
    volumes:
      # Mount toàn bộ code dự án vào container (sửa code máy thật là web cập nhật ngay)
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # MySQL Database Container
  db:
    image: mysql:8.0
    container_name: account_shop_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MYSQL_USER: ${DB_USER:?Set DB_USER in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # Tự động nạp dữ liệu từ database.sql khi khởi động lần đầu
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Lưu trữ dữ liệu lâu dài
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Quản lý Database qua giao diện web phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: account_shop_pma
    restart: always
    ports:
      - "${PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      - db

volumes:
  mysql_data:
